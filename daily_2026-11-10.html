<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정가거부 혜택 2026-11-10</title>
<style>
:root{--bg:#14161a;--panel:#1c1f25;--card:#20242b;--card2:#272c34;--line:#2e333c;--ink:#e8e9ec;--soft:#a3a8b3;--faint:#6f7684;--acc:#4fd1b5;--acc2:#f5b94a;--warn:#f08a6c;--accbg:#4fd1b518}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Noto Sans KR",sans-serif}
a{color:var(--acc);text-decoration:none}
header{padding:22px 20px 6px;max-width:1180px;margin:0 auto}
header h1{margin:0;font-size:21px}
header .sub{color:var(--soft);font-size:13px;margin-top:2px}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1180px;margin:0 auto;padding:14px 20px 30px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:12px}
.panel h3{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.panel h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--soft);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0c1a17;font-weight:700}
input[type=search]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}

.main{min-width:0}
.count{color:var(--soft);font-size:13px;margin:0 0 8px}

.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--soft)}
.card h2{margin:6px 0 10px;font-size:17px;line-height:1.4}
.tldr{background:var(--accbg);border-radius:8px;padding:9px 12px;color:var(--ink);font-size:14.5px;margin-bottom:6px}
.cat{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font-size:13px;font-weight:700;color:var(--acc2)}
.cat i{font-style:normal;font-weight:400;color:var(--faint);font-size:12px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:start}
.item:last-of-type{border-bottom:0}
.item input{grid-row:1/3;margin-top:5px;accent-color:var(--acc)}
.item .nm{font-weight:600;overflow-wrap:anywhere}
.item .dl{grid-column:3;grid-row:1;text-align:right;font-weight:800;color:var(--acc);white-space:nowrap}
.item .dt{grid-column:2/4;grid-row:2;font-size:13px;color:var(--soft);overflow-wrap:anywhere}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.box{background:var(--card2);border-radius:10px;padding:10px 13px}
.box .lb{font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--acc);margin-bottom:4px}
.box.warn .lb{color:var(--warn)}
.box ul,.box ol{margin:0;padding-left:18px;color:var(--ink);font-size:13.5px}
.box li{margin:2px 0;overflow-wrap:anywhere}
.links{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:4px 11px;font-size:13px;color:var(--ink)}
.pill:hover{border-color:var(--acc)}
.pill small{color:var(--faint);font-size:11px}
.fold{cursor:pointer;user-select:none}
.chead{display:flex;align-items:center;gap:6px}
.car{display:inline-block;width:16px;color:var(--faint);font-size:12px}
.cat.fold:hover,.box .lb.fold:hover,.chead:hover .car{color:var(--ink)}
summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none;display:none}
@media(max-width:820px){summary{display:block}details[open]>summary{margin-bottom:6px}}
mark{background:#f5b94a55;color:inherit;border-radius:3px}
.more{background:none;border:0;color:var(--acc);cursor:pointer;padding:6px 0;font-size:13px}
.out{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 20px 40px;max-width:1140px}
@media(min-width:1220px){.out{margin:0 auto 40px}}
.out h3{margin:0 0 8px;font-size:13px;color:var(--soft)}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.6 ui-monospace,Consolas,monospace;resize:vertical}
button.copy{margin-top:8px;background:var(--acc);color:#0c1a17;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function controls(){

        benCount += its.length;
        const fk = `g${vi}-${gi}`, gf = st.fold.has(fk);
        body += `<div class="cat fold" data-f="${fk}"><span class="car">${gf?"▸":"▾"}</span>${hl(g.category||"혜택")} <i>${its.length}</i></div>`;
        if(gf) return;
        its.forEach(({it, ii}) => {
          if(rendered >= lim){ hidden++; return; }
          rendered++;
          const id = vi+"|"+gi+"|"+ii;
          body += `<label class="item"><input type="checkbox" data-id="${id}" ${st.checked.has(id)?"checked":""}><span class="nm">${hl(it.name)}</span><span class="dl">${hl(it.deal)}</span>${it.detail?`<span class="dt">${hl(it.detail)}</span>`:""}</label>`;
        });
      });
      if(hidden) body += `<button class="more" data-k="${vi}">+ ${hidden}개 더 보기</button>`;
    }

    let boxes = "";
    const T = v.target.filter(has), H = v.how.filter(has), C = v.caution.filter(has);
    const box = (key, label, cls, tag, arr) => { const f = st.fold.has(key); return `<div class="box ${cls}"><div class="lb fold" data-f="${key}"><span class="car">${f?"▸":"▾"}</span>${label}</div>${f?"":list(tag,arr)}</div>`; };
    if(st.secs.has("대상") && T.length) boxes += box(`b${vi}-t`, "대상", "", "ul", T);
    if(st.secs.has("신청방법") && H.length) boxes += box(`b${vi}-h`, "신청방법·기간", "", "ol", H);
    if(st.secs.has("유의사항") && C.length) boxes += box(`b${vi}-c`, "⚠ 유의사항", "warn", "ul", C);
    if(boxes) body += `<div class="boxes">${boxes}</div>`;

    if(st.secs.has("관련 링크")){
      const ls = (v.links||[]).filter(l => titleHit || has(l.label+" "+l.url));
      if(ls.length) body += `<div class="links">` + ls.map(l => `<a class="pill" href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${hl(l.label||new URL(l.url).hostname)} <small>${esc(l.src)}</small></a>`).join("") + `</div>`;
    }
    if(st.q && !titleHit && !body.replace(/<[^>]*>/g,"").trim()) return;
    shown++;
    const cf = st.fold.has("c"+vi);
    html += `<div class="card ${v.kind==="쇼츠"?"short":""}"><div class="fold chead" data-f="c${vi}"><span class="car">${cf?"▸":"▾"}</span><span class="tag">${v.kind}</span>${cf&&benCount?`<span class="tag">혜택 ${benCount}개</span>`:""}</div><h2><a href="${esc(v.url)}" target="_blank" rel="noopener">${hl(v.title)}</a></h2>${cf?"":body}</div>`;
  });
  $("cards").innerHTML = html || `<div class="empty">조건에 맞는 항목이 없습니다.</div>`;
  $("count").textContent = `${shown}개 영상 표시 중`;
  $("cards").querySelectorAll("input[data-id]").forEach(i => i.onchange = () => { i.checked ? st.checked.add(i.dataset.id) : st.checked.delete(i.dataset.id); renderOut(); });
  $("cards").querySelectorAll(".more").forEach(b => b.onclick = () => { st.expanded.add(Number(b.dataset.k)); render(); });
  $("cards").querySelectorAll(".fold").forEach(el => el.onclick = () => { const k = el.dataset.f; st.fold.has(k) ? st.fold.delete(k) : st.fold.add(k); renderCards(); });
}
function renderOut(){
  const by = {};
  st.checked.forEach(id => { const [vi, gi, ii] = id.split("|").map(Number); const it = DATA[vi].groups[gi].items[ii]; (by[vi] = by[vi]||[]).push(`${it.name} — ${it.deal}${it.detail?" ("+it.detail+")":""}`); });
  const t = Object.keys(by).map(vi => `[${DATA[vi].kind}] ${DATA[vi].title}\n${DATA[vi].url}\n`+by[vi].map(x=>"• "+x).join("\n")).join("\n\n");
  $("out").value = t || "관심 있는 혜택의 체크박스를 누르면 여기에 모입니다.";
}
function render(){ controls(); renderCards(); renderOut(); }
$("q").oninput = e => { st.q = e.target.value.trim(); renderCards(); };
$("copy").onclick = () => { navigator.clipboard.writeText($("out").value).then(() => { $("copy").textContent = "복사됨!"; setTimeout(()=>$("copy").textContent="복사",1200); }); };
if(window.innerWidth <= 820) $("pd").open = false;
render();
</script>
</body>
</html>
