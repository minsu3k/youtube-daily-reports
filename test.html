<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정가거부 혜택 2026-11-05</title>
<style>
:root{--bg:#14161a;--panel:#1c1f25;--card:#20242b;--line:#2e333c;--ink:#e8e9ec;--soft:#a3a8b3;--faint:#6f7684;--acc:#4fd1b5;--acc2:#f5b94a;--warn:#f08a6c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"Segoe UI","Noto Sans KR",sans-serif}
a{color:var(--acc);text-decoration:none}
header{padding:22px 20px 6px;max-width:1180px;margin:0 auto}
header h1{margin:0;font-size:21px}
header .sub{color:var(--soft);font-size:13px;margin-top:2px}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:18px;max-width:1180px;margin:0 auto;padding:14px 20px 30px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:12px}
.panel h3{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.panel h3:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--soft);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#0c1a17;font-weight:700}
input[type=search]{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft);padding:2px 0;cursor:pointer}
.main{min-width:0}
.count{color:var(--soft);font-size:13px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card.short{border-left-color:var(--acc2)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--bg);color:var(--soft);margin-right:6px}
.card h2{margin:4px 0 8px;font-size:16.5px;line-height:1.4}
.sec{margin-top:10px}
.sec .lb{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--acc);margin-bottom:3px}
.sec.warn .lb{color:var(--warn)}
.row{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row input{margin-top:5px;accent-color:var(--acc);flex:none}
.row span,.plain{color:var(--ink);overflow-wrap:anywhere}
mark{background:#f5b94a55;color:inherit;border-radius:3px}
.more{background:none;border:0;color:var(--acc);cursor:pointer;padding:4px 0;font-size:13px}
.out{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 20px 40px;max-width:1140px}
@media(min-width:1220px){.out{margin:0 auto 40px}}
.out h3{margin:0 0 8px;font-size:13px;color:var(--soft)}
textarea{width:100%;min-height:120px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.6 ui-monospace,Consolas,monospace;resize:vertical}
button.copy{margin-top:8px;background:var(--acc);color:#0c1a17;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
.empty{color:var(--faint);padding:30px 0;text-align:center}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:10px 14px}.panel{position:static}header{padding:18px 14px 0}.out{margin:0 14px 30px}}
</style>
</head>
<body>
<header><h1>🎁 정가거부 혜택 리포트</h1><div class="sub">2026-11-05 · 신규 <b id="total"></b>개 · 영상 화면 + 자막을 함께 분석</div></header>
<div class="wrap">
  <aside class="panel">
    <h3>프리셋</h3>
    <div class="chips" id="presets"></div>
    <h3>종류</h3><div class="chips" id="kinds"></div>
    <h3>검색</h3><input type="search" id="q" placeholder="업체·상품·키워드">
    <h3>표시할 항목</h3><div id="secs"></div>
    <h3>혜택 줄 수</h3>
    <div class="chips" id="limits"></div>
  </aside>
  <main class="main"><p class="count" id="count"></p><div id="cards"></div></main>
</div>
<section class="out"><h3>✅ 체크한 혜택 모아보기 (카드 안 체크박스를 눌러 담기)</h3>
  <textarea id="out" readonly></textarea><button class="copy" id="copy">복사</button></section>
<script>
const DATA = [{"kind": "쇼츠", "title": "진라면 중간맛 2,600원 ㄷㄷ", "url": "https://www.youtube.com/shorts/DuhSdlMgjXo", "sections": [{"label": "혜택", "lines": ["• 오뚜기 진라면 약간매운맛 120g 5개입: 2,600원 (43% 할인, 정가 4,580원, 쿠폰할인 850원)", "• 오뚜기 오동통면 120g 5개입: 3,260원 (22% 할인)", "• 오뚜기 더 핫 열라면: 2,740원 (44% 할인)", "• 양조식초 1.8L 2개: 2,880원 (자막에만 있음)", "• 오뚜기 허니머스타드 265g 2개: 3,470원 (50% 할인)", "• 오뚜기 딸기잼 500g: 3,890원 (50% 할인)", "• 세타필 모이스춰라이징 크림 550g: 13,260원 (56% 할인)"]}, {"label": "대상", "lines": ["쿠팡에서 구매하는 누구나"]}, {"label": "신청방법·기간", "lines": ["• 영상 속 스티커를 누르면 상품 페이지가 열림", "• 세타필 크림은 타임딜 20:15:38 남음"]}, {"label": "유의사항", "lines": ["• 가격은 쿠폰할인이 적용된 금액이 많음", "• 다이제는 자막 2,480원, 화면 2,380원"]}]}, {"kind": "영상", "title": "2026년 11월 알뜰폰 요금제 총정리", "url": "https://www.youtube.com/watch?v=x", "sections": [{"label": "혜택", "lines": ["• 알뜰폰 평생 10GB 2,200원", "• 무제한 7개월 4,500원~"]}, {"label": "대상", "lines": ["알뜰폰 개통 희망자"]}, {"label": "신청방법·기간", "lines": ["각 업체에서 개통, 카페 링크 시 6,000원 추가"]}]}];
const SECS = ["혜택","대상","신청방법·기간","유의사항"];
const DEF = {kind:"전체", q:"", secs:new Set(SECS), limit:6};
const PRESETS = {
  "기본": {secs:SECS, limit:6},
  "혜택만 빠르게": {secs:["혜택"], limit:4},
  "전부 자세히": {secs:SECS, limit:99},
  "신청방법 위주": {secs:["신청방법·기간","유의사항"], limit:99}
};
const st = {kind:DEF.kind, q:DEF.q, secs:new Set(DEF.secs), limit:DEF.limit, checked:new Set(), expanded:new Set()};
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = s => { let t = esc(s); if(st.q){ const r = new RegExp("("+st.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"); t = t.replace(r,"<mark>$1</mark>"); } return t; };
$("total").textContent = DATA.length;

function chips(el, items, isOn, onClick){
  el.innerHTML = ""; items.forEach(([k,label]) => { const b = document.createElement("button"); b.className = "chip"+(isOn(k)?" on":""); b.textContent = label; b.onclick = () => onClick(k); el.appendChild(b); });
}
function controls(){
  chips($("presets"), Object.keys(PRESETS).map(k=>[k,k]), k => false, k => { const p = PRESETS[k]; st.secs = new Set(p.secs); st.limit = p.limit; render(); });
  const n = k => k==="전체" ? DATA.length : DATA.filter(v=>v.kind===k).length;
  chips($("kinds"), ["전체","영상","쇼츠"].map(k=>[k,`${k} ${n(k)}`]), k => st.kind===k, k => { st.kind = k; render(); });
  chips($("limits"), [[3,"3줄"],[6,"6줄"],[99,"전체"]], k => st.limit===k, k => { st.limit = k; render(); });
  $("secs").innerHTML = SECS.map(s => `<label class="chk"><input type="checkbox" data-s="${s}" ${st.secs.has(s)?"checked":""}> ${s}</label>`).join("");
  $("secs").querySelectorAll("input").forEach(i => i.onchange = () => { i.checked ? st.secs.add(i.dataset.s) : st.secs.delete(i.dataset.s); render(); });
}
function rowMatch(t){ return !st.q || t.toLowerCase().includes(st.q.toLowerCase()); }

function renderCards(){
  let shown = 0, html = "";
  DATA.forEach((v, vi) => {
    if(st.kind!=="전체" && v.kind!==st.kind) return;
    const titleHit = rowMatch(v.title);
    let body = "";
    v.sections.forEach((s, si) => {
      if(!st.secs.has(s.label) && s.label!=="내용") return;
      let lines = s.lines.filter(l => titleHit || rowMatch(l));
      if(!lines.length) return;
      const key = vi+"-"+si, isBen = s.label==="혜택";
      const lim = st.expanded.has(key) ? 99 : st.limit;
      const vis = lines.slice(0, lim);
      const rows = vis.map((l, li) => {
        const id = vi+"|"+s.lines.indexOf(l);
        const txt = l.replace(/^[•\-]\s*/, "");
        return isBen ? `<label class="row"><input type="checkbox" data-id="${id}" ${st.checked.has(id)?"checked":""}><span>${hl(txt)}</span></label>`
                     : `<div class="plain">${hl(l)}</div>`;
      }).join("");
      const more = lines.length > vis.length ? `<button class="more" data-k="${key}">+ ${lines.length-vis.length}개 더 보기</button>` : "";
      body += `<div class="sec ${s.label==="유의사항"?"warn":""}"><div class="lb">${s.label}</div>${rows}${more}</div>`;
    });
    if(st.q && !titleHit && !body) return;
    shown++;
    html += `<div class="card ${v.kind==="쇼츠"?"short":""}"><span class="tag">${v.kind}</span><h2><a href="${esc(v.url)}" target="_blank" rel="noopener">${hl(v.title)}</a></h2>${body}</div>`;
  });
  $("cards").innerHTML = html || `<div class="empty">조건에 맞는 항목이 없습니다.</div>`;
  $("count").textContent = `${shown}개 영상 표시 중`;
  $("cards").querySelectorAll("input[data-id]").forEach(i => i.onchange = () => { i.checked ? st.checked.add(i.dataset.id) : st.checked.delete(i.dataset.id); renderOut(); });
  $("cards").querySelectorAll(".more").forEach(b => b.onclick = () => { st.expanded.add(b.dataset.k); render(); });
}
function renderOut(){
  const by = {};
  st.checked.forEach(id => { const [vi, li] = id.split("|").map(Number); const ben = DATA[vi].sections.find(s=>s.label==="혜택"); if(ben) (by[vi] = by[vi]||[]).push(ben.lines[li].replace(/^[•\-]\s*/,"")); });
  const t = Object.keys(by).map(vi => `[${DATA[vi].kind}] ${DATA[vi].title}\n${DATA[vi].url}\n`+by[vi].map(x=>"• "+x).join("\n")).join("\n\n");
  $("out").value = t || "관심 있는 혜택 줄의 체크박스를 누르면 여기에 모입니다.";
}
function render(){ controls(); renderCards(); renderOut(); }
$("q").oninput = e => { st.q = e.target.value.trim(); renderCards(); };
$("copy").onclick = () => { navigator.clipboard.writeText($("out").value).then(() => { $("copy").textContent = "복사됨!"; setTimeout(()=>$("copy").textContent="복사",1200); }); };
render();
</script>
</body>
</html>
