<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>정가거부 혜택 2026-11-08</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F1F3F6;--ink:#14161B;--muted:#5D636E;--line:#E1E4E9;
  --band:#121418;--band-ink:#F5F6F8;--band-muted:#A3A9B3;
  --tag:#FFD60A;--tag-ink:#14161B;--hot:#EE3B2B;--cafe:#0B9A4A;
  --live:#0E8748;--live-bg:#E2F4E9;--soon:#E0321A;--soon-bg:#FDE6E1;--next:#2559C9;--next-bg:#E3EBFB;--done:#858C96;--done-bg:#ECEEF1;
  --link:#2559C9;--link-bg:#E3EBFB;--deal-bg:#FFF3B8;--deal-ink:#14161B;
  --display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1014;--surface:#181B21;--surface2:#20242B;--ink:#ECEEF2;--muted:#9AA1AC;--line:#262A32;
  --band:#08090B;--live:#43C783;--live-bg:#14291D;--soon:#FF5F45;--soon-bg:#35170F;--next:#7AA2FF;--next-bg:#16213A;--done:#737A85;--done-bg:#20242B;
  --link:#7AA2FF;--link-bg:#16213A;--deal-bg:#3A3208;--deal-ink:#FFD60A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.in{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tag);outline-offset:2px}
/* 하이퍼링크는 항상 밑줄 + 호버 시 배경 강조 */
a{color:var(--link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--link) 45%,transparent);transition:background .12s,text-decoration-color .12s}
a:hover{background:var(--link-bg);text-decoration-thickness:2px;text-decoration-color:var(--link);border-radius:3px}

/* 채널 밴드 */
.band{background:var(--band);color:var(--band-ink)}
.band .in{padding-block:22px 20px;display:flex;flex-direction:column;gap:14px}
.kicker{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.01em}
.kicker i{width:24px;height:17px;border-radius:5px;background:var(--tag);position:relative;flex:none}
.kicker i::after{content:"";position:absolute;left:9px;top:4.5px;border-left:7px solid var(--tag-ink);border-top:4px solid transparent;border-bottom:4px solid transparent}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,7vw,44px);line-height:1.08;margin:0;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--tag)}
.sub{margin:0;color:var(--band-muted);font-size:14px}
.stats{font-size:13px;color:var(--band-muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--band-ink);font-weight:700}
.toplinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:760px}
@media(max-width:640px){.toplinks{grid-template-columns:1fr 1fr}}
.tl{display:flex;flex-direction:column;gap:4px;min-width:0;background:#fff;color:#14161B;border-radius:12px;padding:12px 14px;text-decoration:none;transition:transform .12s,box-shadow .12s}
.tl:hover{background:#fff;transform:translateY(-2px);box-shadow:0 6px 18px #0006;text-decoration:none}
.tl b.t{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.2}
.tl small{color:#5D636E;font-size:12px}
.tl .lb{align-self:flex-start;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#fff;padding:1px 7px;border-radius:4px}
.tl .lb.hot{background:var(--hot)}.tl .lb.cafe{background:var(--cafe)}.tl .lb.all{background:#14161B}

/* 도구줄 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:5px 12px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:500}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.pill:hover{border-color:var(--ink)}
input[type=search]{flex:1 1 180px;min-width:0;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px}
details.opts{flex:1 0 100%}
details.opts>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);list-style:none;display:inline-block}
details.opts>summary::-webkit-details-marker{display:none}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;padding:10px 0 4px}
.optgrid h3{margin:0 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;padding:1px 0;cursor:pointer}
label.chk input{accent-color:var(--ink)}

/* 카드 */
main.in{padding-block:18px 8px}
.count{color:var(--muted);font-size:13px;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:16px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.thumb{position:relative;display:block;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;align-self:start}
.thumb:hover{background:#000;border-radius:10px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"";position:absolute;right:8px;bottom:8px;width:26px;height:19px;border-radius:5px;background:#000a}
.thumb::before{content:"";position:absolute;right:16px;bottom:13.5px;z-index:1;border-left:7px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.meta{min-width:0;display:flex;flex-direction:column;gap:7px}
.row1{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chip{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;line-height:1.5}
.k-v{background:var(--live-bg);color:var(--live)}.k-s{background:var(--next-bg);color:var(--next)}
.dd{background:var(--band);color:#fff;font-family:var(--display);font-weight:400;letter-spacing:.02em}
.dd.soon{background:var(--soon)}.dd.end{background:var(--done)}
.tagt{color:var(--muted);font-size:13px}
.meta h2{margin:0;font-size:18px;line-height:1.35;font-weight:700}
.meta h2 a{color:var(--ink);text-decoration-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.meta h2 a:hover{background:var(--link-bg);color:var(--link)}
.tldr{margin:0;color:var(--ink);font-size:14.5px}
.sub2{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.tog{align-self:flex-start;margin-top:auto;border:1px solid var(--line);background:var(--surface2);color:var(--muted);border-radius:99px;padding:3px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.tog:hover{border-color:var(--ink);color:var(--ink)}
.detail{border-top:1px solid var(--line);margin-top:14px;padding-top:2px}

.fold{cursor:pointer;user-select:none}
.car{display:inline-block;width:16px;color:var(--muted);font-size:12px}
.cat{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-family:var(--display);font-size:16px;font-weight:400}
.cat i{font-style:normal;font-family:var(--body);font-weight:700;font-size:11.5px;background:var(--tag);color:var(--tag-ink);border-radius:99px;padding:0 8px}
.cat:hover .car{color:var(--ink)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:start}
.item input{grid-row:1/3;margin-top:5px;accent-color:var(--ink)}
.item .nm{font-weight:700;overflow-wrap:anywhere}
.item a.nm{justify-self:start;color:var(--ink);text-decoration-color:var(--link)}
.item a.nm:hover{color:var(--link)}
.item a.nm sup{color:var(--link);font-size:10px;margin-left:3px;display:inline-block;text-decoration:none}
.item .dl{grid-column:3;grid-row:1;text-align:right;font-weight:800;background:var(--deal-bg);color:var(--deal-ink);border-radius:6px;padding:0 8px;white-space:nowrap;justify-self:end}
.item .dt{grid-column:2/4;grid-row:2;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.box{background:var(--surface2);border-radius:10px;padding:10px 13px}
.box .lb{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--next);margin-bottom:4px}
.box.how .lb{color:var(--live)}.box.warn .lb{color:var(--soon)}
.box ul,.box ol{margin:0;padding-left:18px;font-size:13.5px}
.box li{margin:2px 0;overflow-wrap:anywhere}
.links{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.lk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px}
.lk:hover{border-color:var(--link)}
.lk small{color:var(--muted);font-size:11px;text-decoration:none;display:inline-block}
mark{background:#FFD60A66;color:inherit;border-radius:3px}
.more{background:none;border:0;color:var(--link);cursor:pointer;padding:6px 0;font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.out{margin-block:8px 28px}
.out .box2{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.out h3{margin:0 0 8px;font-size:14px}
textarea{width:100%;min-height:110px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.6 ui-monospace,Consolas,monospace;resize:vertical}
button.copy{margin-top:8px;background:var(--tag);color:var(--tag-ink);border:0;border-radius:99px;padding:7px 18px;font-weight:800;cursor:pointer}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{color:var(--muted);font-size:12.5px;padding-block:14px 40px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="band"><div class="in">
  <div class="kicker"><i></i>정가거부 혜택 리포트</div>
  <h1>오늘 올라온 <em>혜택</em></h1>
  <p class="sub">2026-11-08 · 영상 화면 + 자막을 함께 분석했어요</p>

  <div class="toplinks" id="toplinks"></div>
</div></div>

<div class="bar"><div class="in">

    <div class="optgrid">

      <div><h3>혜택 개수</h3><div class="chips" id="limits"></div></div>
      <div><h3>접기</h3><div class="chips" id="folds"></div></div>

  </details>
</div></div>

<main class="in"><p class="count" id="count"></p><div id="cards"></div></main>
<section class="in out"><div class="box2"><h3>✅ 체크한 혜택 모아보기 <span style="font-weight:400;color:var(--muted)">(카드 안 체크박스를 눌러 담기)</span></h3>
  <textarea id="out" readonly></textarea><button class="copy" id="copy">복사</button></div></section>

const SECS = ["혜택","대상","신청방법","유의사항","관련 링크"];
const PRESETS = {
  "기본": {secs:SECS, limit:8},
  "혜택만 빠르게": {secs:["혜택"], limit:5},
  "전부 자세히": {secs:SECS, limit:99},
  "신청방법 위주": {secs:["신청방법","유의사항","관련 링크"], limit:99}
};
const st = {kind:"전체", q:"", secs:new Set(PRESETS["기본"].secs), limit:8, checked:new Set(), expanded:new Set(), fold:new Set()};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hl = s => { let t = esc(s); if(st.q){ const r = new RegExp("("+esc(st.q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"); t = t.replace(r,"<mark>$1</mark>"); } return t; };
const has = s => !st.q || String(s).toLowerCase().includes(st.q.toLowerCase());
const DOW = ["일","월","화","수","목","금","토"];
const pd = s => new Date(s+"T00:00:00");
const fmtEnd = s => { const d = pd(s); return `${d.getMonth()+1}.${d.getDate()}(${DOW[d.getDay()]})`; };
const fmtUp = s => { if(!s) return ""; const d = pd(s), y = d.getFullYear(); return (y===new Date().getFullYear() ? `${d.getMonth()+1}.${d.getDate()}` : `${String(y).slice(2)}.${d.getMonth()+1}.${d.getDate()}`) + " 업로드"; };
const dleft = s => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((pd(s) - t)/86400000); };

// 상단 통계 · 바로가기
const nItems = v => v.groups.reduce((a,g)=>a+g.items.length,0);
$("stats").innerHTML = `영상 <b>${DATA.filter(v=>v.kind==="영상").length}</b> · 쇼츠 <b>${DATA.filter(v=>v.kind==="쇼츠").length}</b> · 정리한 혜택 <b>${DATA.reduce((a,v)=>a+nItems(v),0)}</b>개`;
(function(){
  const all = DATA.flatMap(v => v.links||[]);
  const hot = all.find(l => /influencers\.coupang\.com/.test(l.url)), cafe = all.find(l => /cafe\.naver\.com\/[^\/?#]+\/?$/.test(l.url));
  const tl = (cls, lb, t, s, href) => `<a class="tl" href="${esc(href)}" ${href==="./"?"":'target="_blank" rel="noopener"'}><span class="lb ${cls}">${lb}</span><b class="t">${t}</b><small>${s}</small></a>`;
  $("toplinks").innerHTML = (hot?tl("hot","HOT","정가거부 핫딜 모음","눌러주시면 도움이 됩니다",hot.url):"") + (cafe?tl("cafe","CAFE","정가거부 네이버 카페","카페 바로가기",cafe.url):"") + tl("all","ALL","전체 리포트 목록","날짜별로 모아보기","./");
})();

function chips(el, items, isOn, onClick){
  el.innerHTML = ""; items.forEach(([k,label]) => { const b = document.createElement("button"); b.className = "pill"+(isOn(k)?" on":""); b.textContent = label; b.onclick = () => onClick(k); el.appendChild(b); });
}
function controls(){
  const n = k => k==="전체" ? DATA.length : DATA.filter(v=>v.kind===k).length;
  chips($("kinds"), ["전체","영상","쇼츠"].map(k=>[k,`${k} ${n(k)}`]), k => st.kind===k, k => { st.kind = k; render(); });
  chips($("presets"), Object.keys(PRESETS).map(k=>[k,k]), () => false, k => { const p = PRESETS[k]; st.secs = new Set(p.secs); st.limit = p.limit; render(); });
  chips($("limits"), [[5,"5개"],[8,"8개"],[99,"전체"]], k => st.limit===k, k => { st.limit = k; render(); });
  chips($("folds"), [["all","전체 접기"],["cat","분류만 접기"],["none","전체 펼치기"]], () => false, k => {
    st.fold.clear();
    DATA.forEach((v, vi) => { if(k==="all") st.fold.add("c"+vi); if(k==="cat") v.groups.forEach((g, gi) => st.fold.add(`g${vi}-${gi}`)); });
    renderCards();
  });
  $("secs").innerHTML = SECS.map(s => `<label class="chk"><input type="checkbox" data-s="${s}" ${st.secs.has(s)?"checked":""}> ${s}</label>`).join("");
  $("secs").querySelectorAll("input").forEach(i => i.onchange = () => { i.checked ? st.secs.add(i.dataset.s) : st.secs.delete(i.dataset.s); render(); });
}
const list = (tag, arr) => `<${tag}>${arr.map(x=>`<li>${hl(x)}</li>`).join("")}</${tag}>`;

function ddChip(v){
  if(!v.end) return "";
  const d = dleft(v.end);
  if(d < 0) return `<span class="chip dd end">종료</span>`;
  return `<span class="chip dd ${d<=3?"soon":""}">${d===0?"D-DAY":"D-"+d}</span>`;
}

function renderCards(){
  let shown = 0, html = "";
  DATA.forEach((v, vi) => {
    if(st.kind!=="전체" && v.kind!==st.kind) return;
    const titleHit = has(v.title+" "+(v.tag||"")+" "+(v.tldr||""));
    let body = "";
    let benCount = 0;
    if(st.secs.has("혜택")){
      const lim = st.expanded.has(vi) ? 99 : st.limit;
      let rendered = 0, hidden = 0;
      v.groups.forEach((g, gi) => {
        const its = g.items.map((it, ii) => ({it, ii})).filter(x => titleHit || has(g.category+" "+x.it.name+" "+x.it.deal+" "+x.it.detail));
        if(!its.length) return;
        benCount += its.length;
        const fk = `g${vi}-${gi}`, gf = st.fold.has(fk);
        body += `<div class="cat fold" data-f="${fk}"><span class="car">${gf?"▸":"▾"}</span>${hl(g.category||"혜택")} <i>${its.length}</i></div>`;
        if(gf) return;
        its.forEach(({it, ii}) => {
          if(rendered >= lim){ hidden++; return; }
          rendered++;
          const id = vi+"|"+gi+"|"+ii;
          body += `<label class="item"><input type="checkbox" data-id="${id}" ${st.checked.has(id)?"checked":""}>${it.link?`<a class="nm" href="${esc(it.link)}" target="_blank" rel="noopener" title="${esc(it.ltitle||"")}">${hl(it.name)}<sup>↗</sup></a>`:`<span class="nm">${hl(it.name)}</span>`}<span class="dl">${hl(it.deal)}</span>${it.detail?`<span class="dt">${hl(it.detail)}</span>`:""}</label>`;
        });
      });
      if(hidden) body += `<button class="more" data-k="${vi}">+ ${hidden}개 더 보기</button>`;
    }
    let boxes = "";
    const T = (v.target||[]).filter(has), H = (v.how||[]).filter(has), C = (v.caution||[]).filter(has);
    const box = (key, label, cls, tag, arr) => { const f = st.fold.has(key); return `<div class="box ${cls}"><div class="lb fold" data-f="${key}"><span class="car">${f?"▸":"▾"}</span>${label}</div>${f?"":list(tag,arr)}</div>`; };
    if(st.secs.has("대상") && T.length) boxes += box(`b${vi}-t`, "대상", "", "ul", T);
    if(st.secs.has("신청방법") && H.length) boxes += box(`b${vi}-h`, "신청방법·기간", "how", "ol", H);
    if(st.secs.has("유의사항") && C.length) boxes += box(`b${vi}-c`, "⚠ 유의사항", "warn", "ul", C);
    if(boxes) body += `<div class="boxes">${boxes}</div>`;
    if(st.secs.has("관련 링크")){
      const ls = (v.links||[]).filter(l => titleHit || has(l.label+" "+l.url));
      if(ls.length) body += `<div class="links">` + ls.map(l => `<a class="lk" href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${hl(l.label||new URL(l.url).hostname)} <small>${esc(l.src)}</small></a>`).join("") + `</div>`;
    }
    if(st.q && !titleHit && !body.replace(/<[^>]*>/g,"").trim()) return;
    shown++;
    const cf = st.fold.has("c"+vi), total = nItems(v);
    const metaBits = [fmtUp(v.uploaded), total?`혜택 ${total}개`:"", v.end?`~${fmtEnd(v.end)}까지`:""].filter(Boolean).join(" · ");
    html += `<article class="card"><div class="hero">
      <a class="thumb" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="영상 보기"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${v.id}/mqdefault.jpg'"></a>
      <div class="meta">
        <div class="row1"><span class="chip ${v.kind==="쇼츠"?"k-s":"k-v"}">${v.kind}</span>${ddChip(v)}${v.tag?`<span class="tagt">${hl(v.tag)}</span>`:""}</div>
        <h2><a href="${esc(v.url)}" target="_blank" rel="noopener">${hl(v.title)}</a></h2>
        ${v.tldr?`<p class="tldr">${hl(v.tldr)}</p>`:""}
        <div class="sub2">${metaBits}</div>
        <button class="tog fold" data-f="c${vi}">${cf?"▾ 상세 펼치기":"▴ 상세 접기"}</button>
      </div></div>${cf?"":`<div class="detail">${body}</div>`}</article>`;
  });
  $("cards").innerHTML = html || `<div class="empty">조건에 맞는 항목이 없습니다.</div>`;
  $("count").textContent = `${shown}개 영상 표시 중`;
  $("cards").querySelectorAll("input[data-id]").forEach(i => i.onchange = () => { i.checked ? st.checked.add(i.dataset.id) : st.checked.delete(i.dataset.id); renderOut(); });
  $("cards").querySelectorAll(".more").forEach(b => b.onclick = () => { st.expanded.add(Number(b.dataset.k)); render(); });
  $("cards").querySelectorAll(".fold").forEach(el => el.onclick = () => { const k = el.dataset.f; st.fold.has(k) ? st.fold.delete(k) : st.fold.add(k); renderCards(); });
}
function renderOut(){
  const by = {};
  st.checked.forEach(id => { const [vi, gi, ii] = id.split("|").map(Number); const it = DATA[vi].groups[gi].items[ii]; (by[vi] = by[vi]||[]).push(`${it.name} — ${it.deal}${it.detail?" ("+it.detail+")":""}${it.link?"\n  "+it.link:""}`); });
  const t = Object.keys(by).map(vi => `[${DATA[vi].kind}] ${DATA[vi].title}\n${DATA[vi].url}\n`+by[vi].map(x=>"• "+x).join("\n")).join("\n\n");
  $("out").value = t || "관심 있는 혜택의 체크박스를 누르면 여기에 모입니다.";
}
function render(){ controls(); renderCards(); renderOut(); }
$("q").oninput = e => { st.q = e.target.value.trim(); renderCards(); };
$("copy").onclick = () => { navigator.clipboard.writeText($("out").value).then(() => { $("copy").textContent = "복사됨!"; setTimeout(()=>$("copy").textContent="복사",1200); }); };
render();
</script>
